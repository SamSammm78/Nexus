<!DOCTYPE html>

<html lang="fr">

<head>

<meta charset="UTF-8">

<title>NEXUS Overlay</title>

<style>

* {
  box-sizing: border-box;
}


html,
body {

  width: 100%;
  height: 100%;

  margin: 0;

  overflow: hidden;

  background: transparent;

  font-family:
    -apple-system,
    BlinkMacSystemFont,
    "SF Pro Display",
    sans-serif;
}


body {

  display: flex;

  justify-content: center;

  align-items: flex-start;

  padding-top: 4px;
}


/* ========================================
   OVERLAY
======================================== */

#overlay {

  width: 540px;

  min-height: 82px;

  padding:
    14px
    18px;

  border-radius:
    0 0 24px 24px;

  background:
    rgba(
      8,
      12,
      18,
      0.86
    );

  border:
    1px solid
    rgba(
      255,
      255,
      255,
      0.09
    );

  border-top:
    none;

  backdrop-filter:
    blur(26px);

  -webkit-backdrop-filter:
    blur(26px);

  box-shadow:
    0 18px 55px
    rgba(
      0,
      0,
      0,
      0.4
    );

  transform:
    translateY(-110%);

  opacity:
    0;

  animation:
    enterOverlay
    420ms
    cubic-bezier(
      .16,
      1,
      .3,
      1
    )
    forwards;
}


@keyframes enterOverlay {

  to {

    transform:
      translateY(0);

    opacity:
      1;
  }
}


/* ========================================
   TOP
======================================== */

.header {

  display: flex;

  align-items: center;

  gap: 13px;
}


.orb {

  position: relative;

  width: 36px;
  height: 36px;

  flex:
    0 0 36px;

  border-radius:
    50%;

  border:
    1px solid
    rgba(
      129,
      220,
      255,
      0.8
    );

  box-shadow:

    0 0 12px
    rgba(
      83,
      200,
      255,
      0.35
    ),

    inset
    0 0 15px
    rgba(
      83,
      200,
      255,
      0.18
    );
}


.orb::before {

  content: "";

  position: absolute;

  inset: 7px;

  border-radius:
    50%;

  border:
    1px solid
    rgba(
      170,
      235,
      255,
      0.9
    );

  animation:
    orbRotate
    3s
    linear
    infinite;
}


.orb::after {

  content: "";

  position: absolute;

  width: 5px;
  height: 5px;

  border-radius:
    50%;

  background:
    #d8f7ff;

  left:
    50%;

  top:
    50%;

  transform:
    translate(
      -50%,
      -50%
    );

  box-shadow:
    0 0 13px
    rgba(
      151,
      233,
      255,
      1
    );

  animation:
    pulse
    1.8s
    ease-in-out
    infinite;
}


@keyframes orbRotate {

  0% {
    transform:
      rotate(0deg)
      scaleX(0.7);
  }

  100% {
    transform:
      rotate(360deg)
      scaleX(0.7);
  }
}


@keyframes pulse {

  0%,
  100% {

    transform:
      translate(
        -50%,
        -50%
      )
      scale(0.8);

    opacity:
      0.6;
  }

  50% {

    transform:
      translate(
        -50%,
        -50%
      )
      scale(1.4);

    opacity:
      1;
  }
}


.title-area {

  flex: 1;
}


.title {

  font-size:
    12px;

  letter-spacing:
    3px;

  font-weight:
    600;

  color:
    rgba(
      235,
      248,
      255,
      0.95
    );
}


.status {

  margin-top:
    4px;

  font-size:
    11px;

  letter-spacing:
    0.8px;

  color:
    rgba(
      148,
      216,
      240,
      0.65
    );
}


/* ========================================
   INPUT
======================================== */

.input-area {

  margin-top:
    13px;

  display:
    flex;

  align-items:
    center;

  gap:
    9px;

  padding:
    10px 13px;

  border-radius:
    13px;

  background:
    rgba(
      255,
      255,
      255,
      0.045
    );

  border:
    1px solid
    rgba(
      255,
      255,
      255,
      0.06
    );
}


.prompt {

  color:
    rgba(
      133,
      224,
      255,
      0.9
    );

  font-size:
    13px;
}


input {

  width: 100%;

  border:
    none;

  outline:
    none;

  background:
    transparent;

  color:
    white;

  font-size:
    14px;
}


input::placeholder {

  color:
    rgba(
      255,
      255,
      255,
      0.32
    );
}


/* ========================================
   RÉPONSE
======================================== */

#answer {

  display:
    none;

  margin-top:
    13px;

  padding-left:
    49px;

  color:
    rgba(
      240,
      248,
      252,
      0.92
    );

  font-size:
    13px;

  line-height:
    1.45;
}


#answer.visible {

  display:
    block;
}


/* ========================================
   THINKING
======================================== */

.thinking .orb {

  animation:
    thinkingOrb
    0.8s
    ease-in-out
    infinite alternate;
}


@keyframes thinkingOrb {

  from {

    box-shadow:

      0 0 10px
      rgba(
        83,
        200,
        255,
        0.25
      ),

      inset
      0 0 10px
      rgba(
        83,
        200,
        255,
        0.1
      );
  }

  to {

    box-shadow:

      0 0 28px
      rgba(
        83,
        200,
        255,
        0.65
      ),

      inset
      0 0 22px
      rgba(
        83,
        200,
        255,
        0.3
      );
  }
}

</style>

</head>


<body>

<div id="overlay">

  <div class="header">

    <div class="orb"></div>

    <div class="title-area">

      <div class="title">
        NEXUS
      </div>

      <div
        class="status"
        id="status"
      >
        CORE ONLINE
      </div>

    </div>

  </div>


  <div class="input-area">

    <div class="prompt">
      ›
    </div>

    <input
      id="input"
      placeholder="Demande quelque chose à NEXUS..."
      autocomplete="off"
      autofocus
    >

  </div>


  <div id="answer"></div>

</div>


<script>

const overlay =
  document.getElementById(
    "overlay"
  );

const input =
  document.getElementById(
    "input"
  );

const status =
  document.getElementById(
    "status"
  );

const answer =
  document.getElementById(
    "answer"
  );


function simulateNexus(
  message
) {

  overlay
    .classList
    .add(
      "thinking"
    );


  status.textContent =
    "THINKING";


  answer
    .classList
    .remove(
      "visible"
    );


  setTimeout(
    () => {

      overlay
        .classList
        .remove(
          "thinking"
        );


      status.textContent =
        "CORE ONLINE";


      answer.textContent =
        `Commande reçue : "${message}"`;


      answer
        .classList
        .add(
          "visible"
        );


      input.value =
        "";


      input.focus();

    },

    900
  );
}


input.addEventListener(
  "keydown",
  event => {

    if (
      event.key ===
      "Enter"
    ) {

      const message =
        input.value.trim();


      if (
        message
      ) {

        simulateNexus(
          message
        );
      }
    }
  }
);


document.addEventListener(
  "keydown",
  event => {

    if (
      event.key ===
      "Escape"
    ) {

      window.close();
    }
  }
);


window.addEventListener(
  "focus",
  () => {

    input.focus();
  }
);

</script>

</body>

</html>
